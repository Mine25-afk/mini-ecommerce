name: order

# Solo corre si cambia esta app, la librería compartida o la configuración del monorepo.
on:
  push:
    branches: [main]
    paths:
      - "apps/order/**"
      - "libs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "nest-cli.json"
      - ".github/workflows/order.yml"
      - ".github/workflows/_service.yml"
  pull_request:
    paths:
      - "apps/order/**"
      - "libs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "nest-cli.json"
      - ".github/workflows/order.yml"
      - ".github/workflows/_service.yml"

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      app: order
